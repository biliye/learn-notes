server:
  port: 8080

spring:
  application:
    name: learn-notes-backend
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://127.0.0.1:3306/learn_notes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${APP_DB_USERNAME:root}
    password: ${APP_DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler

app:
  jwt:
    # 必填：缺失则启动失败（R28 明文不进仓库）
    secret: ${APP_JWT_SECRET:}
    expire-minutes: ${APP_JWT_EXPIRE_MINUTES:720}
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
  register:
    enabled: ${APP_REGISTER_ENABLED:true}
  api-token: ${APP_API_TOKEN:}
  storage-dir: ${APP_STORAGE_DIR:storage/docs}
  upload-dir: ${APP_UPLOAD_DIR:storage/uploads}
  max-image-mb: ${APP_MAX_IMAGE_MB:5}
  base-url: ${APP_BASE_URL:http://127.0.0.1:8080}
