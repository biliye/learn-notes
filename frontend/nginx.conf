server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # 前端静态资源（history 路由：找不到文件回退 index.html）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 编译产物长缓存，入口 html 禁缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口 html 禁缓存：SPA 必须每次回源校验，否则手机/WebView 会一直用旧 index.html
    # 引用旧哈希的 JS bundle，导致功能不更新（如登录错误提示）
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # /api 反代到后端（透传 Authorization / X-Api-Token）
    location /api/ {
        proxy_pass http://ln-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Api-Token $http_x_api_token;
        proxy_read_timeout 120s;
    }

    # 图片由 Nginx 直接读共享卷托管（D11：不过后端、无需鉴权）
    location /uploads/ {
        alias /app/storage/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ============================================================
    # HTTPS 预留段（需自行申请证书后启用）：
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ...（其余配置同 80 段）
    # }
    # server { listen 80; return 301 https://$host$request_uri; }
    # ============================================================
}
